[package]
name = "helioprobe"
version = "2.3.0"
edition = "2021"
authors = ["Bryan P. White <crvscience.com>"]
description = "Scientifically accurate native Rust 3D space probe, Sun-Earth L2 space telescopes, eccentric comets with dynamic solar-wind ion & dust tails, articulated landers/cryobots, and public astronomy simulator"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
png = "0.17"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
